name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:        # lets you press "Run workflow" manually in the Actions tab

jobs:
  c-engine:
    name: C engine (strict build, tests, ASan, Valgrind)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - run: BENCH_ITERS=3 bash scripts/verify.sh

  apk:
    name: Flutter APK (arm64)
    needs: c-engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate a fresh Flutter Android project
        run: flutter create --platforms=android --project-name upscale_app --org dev.upscaler app_build

      - name: Add engine, Dart code and dependencies
        run: |
          mkdir -p app_build/native
          cp -r CMakeLists.txt include src app_build/native/
          cp flutter/lib/*.dart app_build/lib/
          cp app/main.dart app_build/lib/main.dart
          cd app_build
          flutter pub add ffi image_picker gal
          python3 ../scripts/patch_gradle.py android/app

      - name: Build release APK (arm64 only)
        working-directory: app_build
        run: flutter build apk --release --target-platform android-arm64

      - name: Check the C library really is inside the APK
        working-directory: app_build
        run: unzip -l build/app/outputs/flutter-apk/app-release.apk | grep libupscaler.so

      - uses: actions/upload-artifact@v4
        with:
          name: upscaler-arm64-apk
          path: app_build/build/app/outputs/flutter-apk/app-release.apk
